<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 - CSS Animated Advertisement</title>

    <link rel="stylesheet" href="week3.css">

    <script src="https://kit.fontawesome.com/your-kit-id.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="adWrapper">

        <!-- Scene 1: the CSS animation -->
        <div id="adScene1">
            <h1 class="adTitle">Homeward Bound</h1>
            <p class="adSub">Adventure is out there</p>
            <div class="adSun"></div>
        </div>

        <!-- Scene 2: replay button, hidden until scene 1 finishes -->
        <div id="adScene2">
            <div id="adReplay">
                <i class="fa-solid fa-circle-play" onclick="adReplay()"></i>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
