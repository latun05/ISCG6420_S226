<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" type="text/css" href="shopping-cart.css">
</head>
<body>
    <h1>Add Books to the Shopping Cart</h1>

    <div id="txtContainer">
        <div id="txtBookInfo" class="display"></div>
        <div id="txtCart" class="display"></div>
    </div>

    <div style="text-align:right; margin-right:20px; margin-top:5px;">
        <button type="button" onclick="clearCart()">Clear Cart</button>
        <button type="button" onclick="checkOut()">Check Out</button>
    </div>

    <script src="shopping-cart.js"></script>
</body>
</html>
