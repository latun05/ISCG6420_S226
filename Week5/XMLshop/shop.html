<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <style>
        /* Task 2: Custom CSS to make the shop look nice */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f9f9f9;
            margin: 30px;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
            margin-right: 10px;
        }

        button:hover {
            background-color: #2980b9;
        }

        table {
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background-color: #2c3e50;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #f1f9ff;
        }

        img {
            width: 55px;
            height: auto;
            border-radius: 4px;
            display: block;
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            font-size: 20px;
            line-height: 1;
            padding: 0;
            margin: 0 4px;
            background-color: #e67e22;
            border-radius: 4px;
            vertical-align: middle;
        }

        .qty-btn:hover {
            background-color: #d35400;
        }

        .qty-input {
            width: 55px;
            text-align: center;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
            vertical-align: middle;
        }

        .subtotal {
            font-weight: bold;
            color: #27ae60;
        }

        #total {
            text-align: right;
            max-width: 900px;
            margin: 10px auto;
            font-size: 1.4em;
            font-weight: bold;
            color: #2c3e50;
            background: #ecf0f1;
            padding: 12px 20px;
            border-radius: 6px;
        }

        .action-bar {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <h1>Shop</h1>

    <div class="action-bar">
        <button type="button" onclick="show_products()">Display all products</button>
        <button type="button" onclick="calculate_total()">Calculate Total</button>
    </div>

    <table id="dispProduct">
        <!-- Table content will be generated by JavaScript -->
    </table>

    <div id="total"></div>

    <script>
        // Product constructor 
        function product(productName, price, image) {
            this.productName = productName;
            this.price = price;
            this.image = image;
        }

        // Load products from XML 
        var products = [];

        if (window.XMLHttpRequest) {
            // code for IE7+, Firefox, Chrome, Opera, Safari
            xmlhttp = new XMLHttpRequest();
        } else {
            // code for IE6, IE5
            xmlhttp = new ActiveXObject("Microsoft.XMLHTTP");
        }

        xmlhttp.open("GET", "product_list.xml", false);
        xmlhttp.send();
        var xmlDoc = xmlhttp.responseXML;
        var x = xmlDoc.getElementsByTagName("Product");

        for (var i = 0; i < x.length; i++) {
            var pName = x[i].getElementsByTagName("ProductName")[0].childNodes[0].nodeValue;
            var pPrice = Number(x[i].getElementsByTagName("Price")[0].childNodes[0].nodeValue);
            var pImage = x[i].getElementsByTagName("Image")[0].childNodes[0].nodeValue;
            var prod = new product(pName, pPrice, pImage);
            products.push(prod);
        }

        // Display products in table 
        function show_products() {
            var table = document.getElementById('dispProduct');
            table.innerHTML = ''; // clear previous content

            // Header row
            var header = table.insertRow(0);
            header.insertCell(0).innerHTML = 'Product';
            header.insertCell(1).innerHTML = 'Price';
            header.insertCell(2).innerHTML = 'Image';
            header.insertCell(3).innerHTML = 'Quantity';
            header.insertCell(4).innerHTML = 'Subtotal';

            // Product rows
            for (var i = 0; i < products.length; i++) {
                var row = table.insertRow(i + 1); // +1 because header is row 0

                var cellName = row.insertCell(0);
                var cellPrice = row.insertCell(1);
                var cellImage = row.insertCell(2);
                var cellQty = row.insertCell(3);
                var cellSubtotal = row.insertCell(4);

                cellName.innerHTML = products[i].productName;
                cellPrice.innerHTML = '$' + products[i].price;
                cellImage.innerHTML = '<img src="images/' + products[i].image + '" alt="' + products[i].productName + '">';

                // Quantity controls: + button, input, - button 
                var plusBtn = document.createElement('button');
                plusBtn.textContent = '+';
                plusBtn.className = 'qty-btn';
                plusBtn.onclick = (function(index) {
                    return function() { changeQty(index, 1); };
                })(i);

                var qtyInput = document.createElement('input');
                qtyInput.type = 'number';
                qtyInput.value = 0;
                qtyInput.min = 0;
                qtyInput.id = 'q' + i;
                qtyInput.className = 'qty-input';
                qtyInput.onchange = (function(index) {
                    return function() { updateSubtotal(index); };
                })(i);

                var minusBtn = document.createElement('button');
                minusBtn.textContent = '-';
                minusBtn.className = 'qty-btn';
                minusBtn.onclick = (function(index) {
                    return function() { changeQty(index, -1); };
                })(i);

                cellQty.appendChild(plusBtn);
                cellQty.appendChild(qtyInput);
                cellQty.appendChild(minusBtn);

                // Subtotal cell
                cellSubtotal.id = 'sub' + i;
                cellSubtotal.className = 'subtotal';
                cellSubtotal.innerHTML = '$0';
            }
        }

        // Adjust quantity with + / - buttons 
        function changeQty(index, delta) {
            var qtyInput = document.getElementById('q' + index);
            var current = parseInt(qtyInput.value) || 0;
            var newVal = current + delta;
            if (newVal < 0) newVal = 0;
            qtyInput.value = newVal;
            updateSubtotal(index);
        }

        // Update individual subtotal 
        function updateSubtotal(index) {
            var qty = parseInt(document.getElementById('q' + index).value) || 0;
            var subtotal = qty * products[index].price;
            document.getElementById('sub' + index).innerHTML = '$' + subtotal;
        }

        // Calculate grand total 
        function calculate_total() {
            var total = 0;
            for (var i = 0; i < products.length; i++) {
                var qty = parseInt(document.getElementById('q' + i).value) || 0;
                total += qty * products[i].price;
            }
            document.getElementById('total').innerHTML = 'Total to pay = $' + total;
        }
    </script>

</body>
</html>
