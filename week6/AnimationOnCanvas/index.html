<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Animation on Canvas</title>
</head>
<body onload="init()">
  <canvas id="myCanvas" width="400" height="400"></canvas>

  <script>
    var context;
    var x = 10, y = 10;
    var dx = 20, dy = 20;
    var hue = 0;
    var myMove;

    function init() {
      context = document.getElementById('myCanvas').getContext('2d');
      myMove = setInterval(draw, 110);
    }

    function draw() {
      // Clear previous frame
      context.clearRect(0, 0, 400, 400);

      context.beginPath();
      // Challenge: animate colour as well
      context.fillStyle = "hsl(" + hue + ", 100%, 50%)";
      context.arc(x, y, 10, 0, 2 * Math.PI, true);
      context.closePath();
      context.fill();

      x += dx;
      y += dy;
      hue = (hue + 5) % 360;

      // Bounce off edges
      if (x > 390 || x < 10) dx = -dx;
      if (y > 390 || y < 10) dy = -dy;
    }
  </script>
</body>
</html>
