<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Arrays and Multiple Balls</title>
  <style>
    canvas { border: 1px solid #333; }
  </style>
</head>
<body>
  <canvas id="myCanvas" width="500" height="500"></canvas>

  <script>
    var canvas = document.getElementById('myCanvas');
    var ctx = canvas.getContext('2d');

    // Arrays for 5 balls: x/y positions and dx/dy speeds
    var x = [150, 0, 60, 250, 290];
    var y = [0, 100, 0, 250, 0];
    var dx = [2, 3, -2, 1, 4];
    var dy = [1, 2, 3, -2, -1];
    var radius = 20;

    function draw() {
      // Clear the canvas before redrawing
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Loop through each ball using the array index
      for (var i = 0; i < x.length; i++) {
        // Draw ball i
        ctx.beginPath();
        ctx.arc(x[i], y[i], radius, 0, 2 * Math.PI, true);
        ctx.closePath();
        ctx.fillStyle = "red";
        ctx.strokeStyle = "red";
        ctx.fill();
        ctx.stroke();

        // Move ball i
        x[i] += dx[i];
        y[i] += dy[i];

        // Boundary checking: reverse direction at edges
        if (x[i] > canvas.width - radius || x[i] < radius) {
          dx[i] = -dx[i];
        }
        if (y[i] > canvas.height - radius || y[i] < radius) {
          dy[i] = -dy[i];
        }
      }
    }

    // Animate roughly every 20 milliseconds
    setInterval(draw, 20);
  </script>
</body>
</html>
