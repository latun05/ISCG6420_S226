<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Animated Face</title>
  <style>
    canvas { border: 12px solid blue; }
  </style>
</head>
<body>
  <canvas id="myCanvas" width="500" height="500"></canvas>

  <script>
    var canvas, ctx;

    var xp = 15, yp = 15;   // pupil offset
    var xpAdd = 3, ypAdd = 1;

    window.onload = function() {
      canvas = document.getElementById('myCanvas');
      ctx = canvas.getContext('2d');
      drawFace();
      setInterval(moveEyes, 180);
    };

    function drawFace() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Face
      ctx.beginPath();
      ctx.arc(250, 250, 150, 0, 2 * Math.PI);
      ctx.closePath();
      ctx.fillStyle = "rgb(255,200,200)";
      ctx.fill();
      ctx.strokeStyle = "black";
      ctx.lineWidth = 5;
      ctx.stroke();

      // Eyes (white circles)
      ctx.beginPath();
      ctx.arc(200, 220, 45, 0, 2 * Math.PI);
      ctx.closePath();
      ctx.fillStyle = "white";
      ctx.fill();
      ctx.strokeStyle = "black";
      ctx.lineWidth = 5;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(300, 220, 45, 0, 2 * Math.PI);
      ctx.closePath();
      ctx.fillStyle = "white";
      ctx.fill();
      ctx.strokeStyle = "black";
      ctx.lineWidth = 5;
      ctx.stroke();

      // Mouth (red semi-circle)
      ctx.beginPath();
      ctx.arc(250, 300, 60, 0, Math.PI, false);
      ctx.closePath();
      ctx.strokeStyle = "red";
      ctx.lineWidth = 10;
      ctx.stroke();

      // Blue pupils
      drawPupils(xp, yp);
    }

    function drawPupils(offsetX, offsetY) {
      ctx.beginPath();
      ctx.arc(200 + offsetX, 220 + offsetY, 12, 0, 2 * Math.PI);
      ctx.closePath();
      ctx.fillStyle = "blue";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(300 + offsetX, 220 + offsetY, 12, 0, 2 * Math.PI);
      ctx.closePath();
      ctx.fillStyle = "blue";
      ctx.fill();
    }

    function moveEyes() {
      xp += xpAdd;
      yp += ypAdd;

      if (xp > 20 || xp < -20) xpAdd = -xpAdd;
      if (yp > 20 || yp < -20) ypAdd = -ypAdd;

      drawFace();
    }
  </script>
</body>
</html>
